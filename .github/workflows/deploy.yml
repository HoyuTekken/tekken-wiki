name: Deploy VitePress to GitHub Pages

# For Testing
#on:
#  push:
#    branches:
#      - main
#  workflow_dispatch:

on:
    push:
        tags:
            - "deploy-*"
    workflow_dispatch:
        inputs:
            deploy_reason:
                description: "Deploy reason (デプロイの理由)"
                required: true
                default: "manual deploy"

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        outputs:
            deploy_type: ${{ steps.context.outputs.deploy_type }}
            deploy_ref: ${{ steps.context.outputs.deploy_ref }}
            deploy_reason: ${{ steps.context.outputs.deploy_reason }}
        steps:
            - uses: actions/checkout@v4
            - name: Set deploy context
              id: context
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "deploy_type=manual" >> $GITHUB_OUTPUT
                    echo "deploy_ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
                    echo "deploy_reason=${{ github.event.inputs.deploy_reason }}" >> $GITHUB_OUTPUT
                  else
                    echo "deploy_type=tag" >> $GITHUB_OUTPUT
                    echo "deploy_ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
                    echo "deploy_reason=tag deploy" >> $GITHUB_OUTPUT
                  fi

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  # cache: "yarn"

            - name: Install dependencies
              run: yarn install --immutable
            - name: Build VitePress site
              run: yarn build
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: docs/.vitepress/dist

    deploy:
        needs: build
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
        runs-on: ubuntu-latest

        steps:
            - name: Guard manual deploy branch
              if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
              run: |
                  echo "Manual deploy is only allowed on main branch"
                  exit 1

            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v4

            - name: Notify ntfy (deploy success)
              if: success()
              run: |
                  curl -H "Title: VitePress Deploy Success" \
                       -H "Priority: default" \
                       -H "Tags: white_check_mark" \
                       -d "Type: ${{ needs.build.outputs.deploy_type }}
                  Ref: ${{ needs.build.outputs.deploy_ref }}
                  Reason: ${{ needs.build.outputs.deploy_reason }}
                  Repo: ${{ github.repository }}
                  Actor: ${{ github.actor }}" \
                  https://ntfy.sh/github-hoyutekken-tekkenwiki-deploy

            - name: Notify ntfy (deploy failure)
              if: always() && failure()
              run: |
                  curl -H "Title: VitePress Deploy Failed" \
                       -H "Priority: high" \
                       -H "Tags: x" \
                       -d "Repository: ${{ github.repository }}
                  Workflow: ${{ github.workflow }}
                  Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  https://ntfy.sh/github-hoyutekken-tekkenwiki-deploy
